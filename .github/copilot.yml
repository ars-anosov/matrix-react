rules:
  - id: project-context
    description: "Контекст репозитория и общие правила"
    alwaysApply: true
    scope: "**/*"
    guidance: |
      Цель: Сборка ReactJS компонент для matrix-js-sdk.
      Документация на русском — сохраняй стиль и терминологию.

      Правила поведения:
      - Действуй как senior FullStack-разработчик.
      - Не расширяй объём правок без запроса. Для критичных изменений указывай риски и проверки.
